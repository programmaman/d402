name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          npm --prefix adapters/ethers ci
          npm --prefix adapters/viem ci
          npm --prefix facilitator ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test adapters
        run: npm run test:adapters

      - name: Test facilitators
        run: npm run test:facilitators

      - name: Verify package contents
        run: npm pack --dry-run
